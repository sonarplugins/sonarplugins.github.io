<section class="hero{% if include.compact %} hero-compact{% endif %}" aria-labelledby="hero-title">
  <div class="container">
    <p class="eyebrow">SonarQube&trade; plugins index</p>
    {% if include.compact %}
      <h1 id="hero-title">Find your next <em>plugin.</em></h1>
    {% else %}
      <h1 id="hero-title">Your SonarQube&trade;<br><em>More powerful</em></h1>
    {% endif %}
    <p class="hero-description">Discover community and commercial plugins to extend your code analysis, reporting and integrations.</p>
    <form class="search-form" action="{{ '/search.html' | relative_url }}" method="get" role="search" id="plugin-search">
      <label class="sr-only" for="search-box">Search plugins, languages or features</label>
      <input id="search-box" type="search" name="query" placeholder="Search plugins, languages or features…" autocomplete="off">
      <button class="button button-primary" type="submit">Search <span aria-hidden="true">→</span></button>
    </form>
    <p class="index-note">{{ site.posts.size }} plugins indexed.</p>
  </div>
</section>

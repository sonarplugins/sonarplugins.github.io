<section class="category-section" id="categories" aria-labelledby="categories-title">
  <div class="container">
    <p class="eyebrow">Explore the ecosystem</p><h2 id="categories-title">Better tools. Better code. Better SonarQube&trade;</h2>
    <div class="category-links">
      {% assign categories = site.categories | sort %}
      {% for category in categories %}<a href="{{ '/search.html' | relative_url }}?category={{ category[0] | url_encode }}"><span class="category-badge{% if category[0] == 'deprecated' %} category-badge-warning{% endif %}">{{ category[0] | escape }}</span><span class="category-count">{{ category[1].size }} <span aria-hidden="true">↗</span></span></a>{% endfor %}
    </div>
  </div>
</section>

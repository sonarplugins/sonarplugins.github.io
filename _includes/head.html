<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.meta_author %}<meta name="author" content="{{ site.meta_author | escape }}">{% endif %}
  {% seo %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  {% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify | escape }}">{% endif %}
  {% if site.bing_verify %}<meta name="msvalidate.01" content="{{ site.bing_verify | escape }}">{% endif %}
</head>

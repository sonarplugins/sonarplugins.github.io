<section class="contact-section" id="contact" aria-labelledby="contact-title">
  <div class="container split-section">
    <div><p class="eyebrow">Get in touch</p><h2 id="contact-title">Something we missed?</h2><p>Send a suggestion or ask us about the index.</p></div>
    <form action="https://formspree.io/{{ site.email | escape }}" method="post" class="contact-form">
      <div class="contact-fields"><label for="name">Name<input id="name" name="name" autocomplete="name" required></label><label for="email">Email address<input id="email" type="email" name="_replyto" autocomplete="email" required></label></div>
      <label for="message">Message<textarea id="message" name="message" rows="4" required></textarea></label>
      <input type="hidden" name="_subject" value="SonarPlugins contact">
      <div hidden><label for="contact-website">Leave this field empty<input id="contact-website" name="_gotcha" autocomplete="off"></label></div>
      <button class="button button-primary" type="submit">Send message <span aria-hidden="true">↗</span></button>
    </form>
  </div>
</section>
